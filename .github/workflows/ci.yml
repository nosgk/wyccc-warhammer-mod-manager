name: CI and Windows EXE

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check backend tests scripts
      - name: Pytest with coverage (Linux, py3.13)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m pytest -q --ignore=tests/test_desktop_bridge.py --cov=backend --cov-report=term-missing --cov-report=xml
      - name: Upload backend coverage
        if: runner.os == 'Linux' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
      - name: Pytest (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Pytest (non-Windows, no coverage)
        if: runner.os != 'Windows' && !(runner.os == 'Linux' && matrix.python == '3.13')
        run: python -m pytest -q --ignore=tests/test_desktop_bridge.py

  frontend:
    name: frontend (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend fixtures for frontend integration tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: ESLint
        working-directory: frontend
        run: pnpm lint
      - name: Prettier
        working-directory: frontend
        run: pnpm format:check
      - name: Vitest
        working-directory: frontend
        run: pnpm test
      - name: Production build
        working-directory: frontend
        run: pnpm build

  harness:
    name: harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version sources
        run: python scripts/check_versions.py
      - name: i18n catalogs
        run: python scripts/check_i18n.py
      - name: Documentation links
        run: python scripts/check_docs.py
      - name: RPC contract
        run: python scripts/check_rpc_contract.py
      - name: Broad exception budget
        run: python scripts/check_exceptions.py
      - name: Metrics snapshot
        run: python scripts/harness_metrics.py > /dev/null

  package:
    name: single-file Windows EXE
    needs: [backend, frontend, harness]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Toolchain
        shell: pwsh
        run: |
          python --version
          node --version
          pnpm --version
          where.exe pnpm
      - name: Build single-file executable
        shell: pwsh
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/build.py --package --output-dir dist/release --skip-install --skip-tests 1> build-out.log 2> build-err.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content build-err.log -Tail 80 | ForEach-Object { Write-Host "::error::$_" }
            Get-Content build-out.log -Tail 40 | ForEach-Object { Write-Host "::error::$_" }
            exit $code
          }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-build-log
          path: |
            build-out.log
            build-err.log
          if-no-files-found: ignore
      - name: Record SHA-256
        shell: pwsh
        run: |
          $exe = "dist/release/Wyccc's Mod Manager.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item -LiteralPath $exe).Length
          "sha256=$hash" | Out-File -Encoding ascii dist/release/sha256.txt
          "size=$size" | Out-File -Encoding ascii -Append dist/release/sha256.txt
          Get-Content dist/release/sha256.txt
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Wyccc-Mod-Manager-windows-x64
          path: |
            dist/release/Wyccc's Mod Manager.exe
            dist/release/sha256.txt
          if-no-files-found: error
