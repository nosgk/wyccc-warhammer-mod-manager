name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: single-file Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Toolchain
        shell: pwsh
        run: |
          python --version
          node --version
          pnpm --version
          where.exe pnpm
      - name: Build single-file executable
        shell: pwsh
        run: |
          python scripts/build.py --package --output-dir dist/release --skip-install --skip-tests 2>&1 | Tee-Object -FilePath build-exe.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content build-exe.log -Tail 60 | ForEach-Object { Write-Host "::error::$_" }
            exit $code
          }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-build-log
          path: build-exe.log
          if-no-files-found: ignore
      - name: Record SHA-256
        shell: pwsh
        run: |
          $exe = "dist/release/Wyccc's Mod Manager.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item -LiteralPath $exe).Length
          "sha256=$hash" | Out-File -Encoding ascii dist/release/sha256.txt
          "size=$size" | Out-File -Encoding ascii -Append dist/release/sha256.txt
          Get-Content dist/release/sha256.txt
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Wyccc-Mod-Manager-windows-x64
          path: |
            dist/release/Wyccc's Mod Manager.exe
            dist/release/sha256.txt
          if-no-files-found: error
